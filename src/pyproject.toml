[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "redhawk"
version = "0.1.0"
description = "RedHawk — AI 驱动的攻击性红队工具（体量小 · 自动化 · 精准度高）"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "typer>=0.12.0",
    "pyyaml>=6.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
]

[project.scripts]
redhawk = "redhawk.cli:main"
rh = "redhawk.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["redhawk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
